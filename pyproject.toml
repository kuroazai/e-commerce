[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardshop"
version = "0.3.0"
description = "Scan, price and sell trading cards: OpenCV recognition, UK marketplace pricing, and sale-email automation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fidelis Mwansa" }]
keywords = [
    "opencv", "perceptual-hash", "inventory", "ebay", "cardmarket",
    "smolagents", "flask", "rest-api", "jwt", "yugioh",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Typing :: Typed",
]
# The original requirements.txt listed only passlib, while the code imported
# bcrypt, pymongo and requests - so a fresh install produced a broken env.
dependencies = [
    "Flask>=2.3",
    "Flask-JWT-Extended>=4.5",
    "bcrypt>=4.0",
    "requests>=2.28",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.3"]
# Card scanning. Kept optional because opencv and numpy are a large install and
# the API, pricing and sale automation all work without them.
vision = ["opencv-python-headless>=4.8", "numpy>=1.24"]
# The LLM escalation layer. Optional on purpose: with no model configured the
# pipeline runs fully deterministic and reports what it would have escalated.
agents = ["smolagents>=1.0"]
all = [
    "pymongo>=4.3",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "smolagents>=1.0",
]
# pytest 8.2 for importorskip(exc_type=...). Without it, a missing optional
# dependency and a broken one both show up as a skip, so a genuinely broken
# opencv install would look exactly like opencv not being installed.
dev = ["pytest>=8.2", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "types-requests"]

[project.scripts]
cardshop = "cardshop.cli:main"

[project.urls]
Homepage = "https://github.com/kuroazai/e-commerce"

[tool.hatch.build.targets.wheel]
packages = ["src/cardshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["vision: needs opencv and numpy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12, not the 3.10 floor this package supports: recent numpy stubs use 3.12
# type syntax and mypy refuses to parse them under an older target. CI runs the
# 3.10 matrix, so a version-specific error still gets caught there.
python_version = "3.12"
files = ["src/cardshop"]
ignore_missing_imports = true
